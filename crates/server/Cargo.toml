[package]
name = "ai-provider-connector-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "HTTP server and dashboard for AI Provider Connector"

[dependencies]
ai-provider-connector-core = { path = "../core" }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
