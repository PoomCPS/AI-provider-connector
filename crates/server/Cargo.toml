[package]
name = "ai-provider-connector-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "HTTP server and dashboard for AI Provider Connector"

[dependencies]
ai-provider-connector-core = { path = "../core" }
axum = { version = "0.8", features = ["json", "tokio"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
