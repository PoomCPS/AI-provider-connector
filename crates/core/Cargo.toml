[package]
name = "ai-provider-connector-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Core library providing a unified interface for AI providers"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"

[dev-dependencies]
tokio-test = "0.4"
